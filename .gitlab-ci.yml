stages:
  - build
  - deploy

variables:
  DEPLOY_HOST: "172.16.0.3"
  DEPLOY_USER: "test"
  FRONTEND_RUNTIME_DIR: "/home/test/tselot_Studio/frontend"

build_frontend_standalone:
  stage: build
  image: node:22-alpine
  script:
    - npm ci
    - export BACKEND_URL="${FRONTEND_BACKEND_URL:-http://127.0.0.1:8080}"
    - export NEXT_PUBLIC_API_BASE_URL="${FRONTEND_BACKEND_URL:-http://127.0.0.1:8080}"
    - export NEXT_PUBLIC_KARAVAN_URL="${FRONTEND_KARAVAN_URL:-http://localhost:8081}"
    - export NEXT_PUBLIC_HAWTIO_URL="${FRONTEND_HAWTIO_URL:-https://camel.hawt.io/online/login?redirectUri=http%3A%2F%2Fcamel.hawt.io%2Fonline%2F}"
    - npm run build
    - mkdir -p frontend-artifact/.next
    - cp -R .next/standalone/. frontend-artifact/
    - cp -R .next/static frontend-artifact/.next/static
    - if [ -d public ]; then cp -R public frontend-artifact/public; fi
    - tar -C frontend-artifact -czf frontend-standalone.tar.gz .
  artifacts:
    expire_in: 7 days
    paths:
      - frontend-standalone.tar.gz
      - scripts/restart-frontend-nohup.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'

deploy_frontend_nohup:
  stage: deploy
  image: alpine:3.20
  needs:
    - build_frontend_standalone
  before_script:
    - apk add --no-cache openssh-client rsync tar
    - test -n "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$FRONTEND_RUNTIME_DIR/current' '$FRONTEND_RUNTIME_DIR/logs'"
    - rsync -az frontend-standalone.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:$FRONTEND_RUNTIME_DIR/frontend-standalone.tar.gz"
    - rsync -az scripts/restart-frontend-nohup.sh "$DEPLOY_USER@$DEPLOY_HOST:$FRONTEND_RUNTIME_DIR/restart-frontend-nohup.sh"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf '$FRONTEND_RUNTIME_DIR/current' && mkdir -p '$FRONTEND_RUNTIME_DIR/current' && tar -xzf '$FRONTEND_RUNTIME_DIR/frontend-standalone.tar.gz' -C '$FRONTEND_RUNTIME_DIR/current' && chmod +x '$FRONTEND_RUNTIME_DIR/restart-frontend-nohup.sh' && '$FRONTEND_RUNTIME_DIR/restart-frontend-nohup.sh'"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
