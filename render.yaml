services:
  - type: web
    name: routeforge
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build && cp -r .next/static .next/standalone/.next/static && mkdir -p .next/standalone/public && if [ -d public ]; then cp -r public/. .next/standalone/public/; fi
    startCommand: HOSTNAME=0.0.0.0 node .next/standalone/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: DEMO_MODE
        value: "true"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: NEXT_PUBLIC_KARAVAN_URL
        value: https://karavan.space/
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: BACKEND_URL
        value: http://127.0.0.1:8484
      - key: NEXTAUTH_URL
        value: https://routeforge.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: KEYCLOAK_CLIENT_ID
        value: routeforge-client
      - key: KEYCLOAK_CLIENT_SECRET
        value: not-used-in-demo
      - key: KEYCLOAK_ISSUER
        value: https://auth.example.com/realms/demo
