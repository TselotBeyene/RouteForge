services:
  - type: web
    name: routeforge
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public 2>/dev/null || true
    startCommand: node .next/standalone/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME
        value: "0.0.0.0"
      - key: DEMO_MODE
        value: "true"
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: BACKEND_URL
        value: http://127.0.0.1:8484
      - key: NEXTAUTH_URL
        value: https://routeforge.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: KEYCLOAK_CLIENT_ID
        value: routeforge-client
      - key: KEYCLOAK_CLIENT_SECRET
        sync: false
      - key: KEYCLOAK_ISSUER
        sync: false
